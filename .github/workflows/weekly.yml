# Weekly tests to catch changes in upstream dependencies like pins
# that break vetiver e.g. changes in pins could break either one or
# both of:
#   1. pypi release
#   2. main branch version

name: Weekly Tests

on:
  schedule:
    - cron: "03 14 * * MON"
  push:
    branches: ['update-weekly']

jobs:
  vetiver_main_pins_main:
    name: 'vetiver main, pins main'
    if: github.repository == 'rstudio/vetiver-python'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Minimum and Maximum supported versions
        python-version: ['3.10']


    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[all]'
          python -m pip install --upgrade git+https://github.com/rstudio/pins-python

      - name: Run tests
        run: |
          make test

  vetiver_pypi_pins_main:
    name: 'vetiver pypi, pins main'
    if: github.repository == 'rstudio/vetiver-python'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Minimum and Maximum supported versions
        python-version: ['3.10']

    steps:
      - name: Get latest release with tag from GitHub API
        id: latestrelease
        run: |
          echo "::set-output name=releasetag::$(curl -s https://api.github.com/repos/rstudio/vetiver-python/releases/latest | jq '.tag_name' | sed 's/\"//g')"

      - name: Confirm Release Tag
        run: |
          echo ${{ steps.latestrelease.outputs.releasetag }}

      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.latestrelease.outputs.releasetag }}

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip install --upgrade git+https://github.com/rstudio/pins-python

      - name: Run Tests
        run: |
          make test

  vetiver_pypi_rsconnect_latest:
    name: 'vetiver pypi, rsconnect latest'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Minimum and Maximum supported versions
        python-version: ['3.9']

    steps:
      - name: Get latest release with tag from GitHub API
        id: latestrelease
        run: |
          echo "::set-output name=releasetag::$(curl -s https://api.github.com/repos/rstudio/vetiver-python/releases/latest | jq '.tag_name' | sed 's/\"//g')"

      - name: Confirm Release Tag
        run: |
          echo ${{ steps.latestrelease.outputs.releasetag }}

      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.latestrelease.outputs.releasetag }}

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip install --upgrade git+https://github.com/rstudio/rsconnect-python

      - name: Run Connect integration tests
        uses: posit-dev/with-connect@0783dabdd24e360e985a4588ce1239c3dc31c542
        with:
          license: ${{ secrets.RSC_LICENSE }}
          command: |
            pip freeze | grep -v '^vetiver' | grep -v '^-e ' > requirements.txt
            echo 'vetiver' >> requirements.txt
            pytest vetiver/tests/test_rsconnect.py -m 'rsc_test'

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly canary failed: ${context.job}`,
              body: `The weekly Connect canary failed on run ${context.runId}. This often means a change in rsconnect-python \`main\` broke vetiver. See https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["ci-failure"]
            })

  vetiver_latest_rsconnect_latest:
    name: 'vetiver latest, rsconnect latest'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Minimum and Maximum supported versions
        python-version: ['3.9']

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[all]'
          python -m pip install --upgrade git+https://github.com/rstudio/rsconnect-python

      - name: Run Connect integration tests
        uses: posit-dev/with-connect@0783dabdd24e360e985a4588ce1239c3dc31c542
        with:
          license: ${{ secrets.RSC_LICENSE }}
          command: |
            pip freeze | grep -v '^vetiver' | grep -v '^-e ' > requirements.txt
            echo 'vetiver' >> requirements.txt
            pytest vetiver/tests/test_rsconnect.py -m 'rsc_test'

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly canary failed: ${context.job}`,
              body: `The weekly Connect canary failed on run ${context.runId}. This often means a change in rsconnect-python \`main\` broke vetiver. See https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["ci-failure"]
            })
